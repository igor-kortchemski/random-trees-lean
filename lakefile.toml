name = "bgw"
version = "0.1.1"
license = "Apache-2.0"
defaultTargets = ["BGW"]
requiresModuleSystem = true

[leanOptions]
autoImplicit = false
warningAsError = true
linter.style.header = true
linter.style.native = true
linter.style.maxHeartbeats = true
linter.style.longFile = 1500

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
# Mathlib v4.35.0
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[require]]
name = "BrownianMotion"
path = "vendor/brownian-motion"

[[lean_lib]]
name = "BGW"
globs = ["BGW.*"]
